[package]
name = "hoi-wasm"
description = "wasm-bindgen build of hoi-core for the browser (runs in a Web Worker)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hoi-core.workspace = true
hoi-store.workspace = true
hoi-crypto.workspace = true
hoi-types.workspace = true
hoi-validate.workspace = true
serde_json.workspace = true
serde.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
