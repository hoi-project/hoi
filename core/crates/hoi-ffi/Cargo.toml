[package]
name = "hoi-ffi"
description = "UniFFI bindings of hoi-core for the native phone apps (Swift, Kotlin)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "hoi_ffi"
# staticlib for the iOS xcframework, cdylib for Android (and for generating bindings), lib for tests.
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
# Generates the Swift and Kotlin bindings from the built library (apps/mobile/scripts).
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli"]

[dependencies]
hoi-core = { workspace = true, features = ["sqlite", "ffi"] }
hoi-store = { workspace = true, features = ["sqlite"] }
hoi-net.workspace = true
hoi-types.workspace = true
hoi-crypto.workspace = true
serde_json.workspace = true
tokio.workspace = true
uniffi = "0.32"
