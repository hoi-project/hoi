[package]
name = "hoi-crypto"
description = "hoi keys, signatures, proof-of-work stamps and the keystore."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hoi-types.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
chacha20.workspace = true
hpke-rs.workspace = true
hpke-rs-crypto.workspace = true
hpke-rs-rust-crypto.workspace = true
getrandom.workspace = true
subtle.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[features]
# Explicit nonces, transform keys and ephemeral seeds, so core/vectors/scatter.json is
# reproducible. Only the vectors generator and conformance tests turn this on; a nonce, key or
# seed used twice breaks the seal it was given to.
deterministic = []

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
