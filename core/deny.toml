# cargo-deny: licences, advisories, sources (CONTRIBUTING.md: dependencies are vetted).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Compile-time macro through iroh 1.4.1 -> netwatch -> netlink-packet-core.
  # Unmaintained advisory, not a reported vulnerability; revisit when iroh drops this chain.
  { id = "RUSTSEC-2024-0436", reason = "paste is a transitive build-time macro in pinned iroh's Linux network monitor" },
  # Unmaintained, not vulnerable. Build-time only (uniffi's toml parsing); no runtime exposure.
  { id = "RUSTSEC-2026-0374", reason = "basic-toml via uniffi build tooling" },
  # Unmaintained, not vulnerable: loro's persistent maps (loro-internal -> im -> sized-chunks,
  # bitmaps), chosen for rules and wiki text. Revisit when loro moves off im.
  { id = "RUSTSEC-2026-0247", reason = "im via loro-internal" },
  { id = "RUSTSEC-2026-0248", reason = "sized-chunks via im via loro-internal" },
  { id = "RUSTSEC-2026-0251", reason = "bitmaps via im via loro-internal" },
  # Unmaintained, not vulnerable: heapless 0.7 through postcard in loro's serde_columnar; on the
  # targets hoi builds for the polyfill passes straight through to the native atomics.
  { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill via postcard's heapless 0.7" },
  # Unmaintained, not vulnerable: a build-time macro helper under genawaiter, which iroh-blobs'
  # streaming fetch uses. It runs only while compiling.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via genawaiter via iroh-blobs" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
