# SonarCloud (.github/workflows/sonarcloud.yml). CI-based analysis: turn off Automatic Analysis
# for the project in SonarCloud, or both run and the CI scan is rejected.
sonar.projectKey=hoi-project_hoi
sonar.organization=hoi-project
sonar.projectName=hoi

sonar.sources=.
sonar.exclusions=vendor/**,**/node_modules/**,**/dist/**,**/target/**,builds/**,\
  apps/web/src/lib/core/wasm/pkg/**,apps/*/src-tauri/gen/**,apps/site/wiki/sbom/**,\
  core/vectors/**,**/*.lock,pnpm-lock.yaml,\
  **/tests/**,**/*.test.ts,**/*.test.mjs,core/crates/*/src/tests.rs

# Tests: the same patterns are excluded from the sources above; a file is never both.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/*.test.ts,**/*.test.mjs,core/crates/*/src/tests.rs
sonar.test.exclusions=vendor/**,**/node_modules/**,**/target/**

# Generated design tokens and fixtures are repetitive by nature.
sonar.cpd.exclusions=packages/tokens/**,**/fixtures/**,**/tests/**

# Coverage is collected for the Rust workspace (cargo llvm-cov in CI). Other languages are left out of
# the coverage measure, so the quality gate does not read "not measured" as "0 % covered".
sonar.rust.lcov.reportPaths=core/lcov.info
sonar.coverage.exclusions=**/*.js,**/*.mjs,**/*.cjs,**/*.ts,**/*.svelte,**/*.html,**/*.css,**/*.sh,**/*.ps1,**/*.kt,**/*.swift,**/*.yml,**/*.yaml,**/*.json,**/Dockerfile,**/*.Dockerfile,\
  apps/*/src-tauri/**
