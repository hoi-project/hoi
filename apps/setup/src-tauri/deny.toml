# cargo-deny for the node setup app. Same policy as core/deny.toml except for unmaintained transitive crates.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Tauri's GTK, zbus and URL-pattern stacks carry unmaintained transitive crates we do not control;
# flag unmaintained crates only when they are our own direct dependencies.
unmaintained = "workspace"
# Unmaintained transitive crates are not flagged here (above), so uniffi's basic-toml
# (RUSTSEC-2026-0374) needs no ignore entry; core/deny.toml keeps its own.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
