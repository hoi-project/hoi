# Manual static build and Pages deployment; needs the HOI_PAGES_ENABLED switch, so that only the
# repository that serves hoi.sh deploys (a fork or a stale copy cannot).
# No long tests or service deployment; see docs/CI.md and deploy/static/README.md.
name: Website

on:
  workflow_dispatch:
  # Publishing a release puts its signed list on the site (/releases/).
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.HOI_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The website needs its repository and its own address. Signing keys are a release's
      # concern: until `downloads` and `manifestKey` are configured, the site and app say that
      # no signed downloads or updates are offered (a preview deploys this way).
      - name: Require website publication configuration before building
        run: node scripts/publication.mjs --site
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - name: wasm-bindgen-cli (same version as the crate, prebuilt)
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install --frozen-lockfile
      - name: Quick source checks
        run: pnpm check:quick
      # Built as anyone can build it again; the digests it prints are the deployment's.
      - name: Build the website and app, with no registry or relay in them
        env:
          HOI_PUBLICATION: site
          VITE_HOI_REGISTRY_URL: ""
          VITE_HOI_RELAY_URLS: "[]"
        run: node scripts/reproduce.mjs --only static
      # The newest published release (prereleases count, drafts don't) replaces the site's
      # placeholder list; it is checked against manifestKey first. Added after the build, so it is
      # not part of the digests above. Without a published release the placeholder stays.
      - name: Add the latest published release list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -z "$tag" ]; then echo "No published release yet; the site keeps its placeholder list."; exit 0; fi
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p manifest.json -p manifest.json.minisig -D dist/releases --clobber
          node scripts/release-site-list.mjs dist/releases
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
