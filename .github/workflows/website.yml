# Manual static build and Pages deployment; needs the HOI_PAGES_ENABLED switch, so that only the
# repository that serves hoi.sh deploys (a fork or a stale copy cannot).
# No long tests or service deployment; see docs/CI.md and deploy/static/README.md.
name: Website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.HOI_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The website needs its repository and its own address. Signing keys are a release's
      # concern: until `downloads` and `manifestKey` are configured, the site and app say that
      # no signed downloads or updates are offered (a preview deploys this way).
      - name: Require website publication configuration before building
        run: node scripts/publication.mjs --site
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - name: wasm-bindgen-cli (same version as the crate, prebuilt)
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install --frozen-lockfile
      - name: Quick source checks
        run: pnpm check:quick
      # Built as anyone can build it again; the digests it prints are the deployment's.
      - name: Build the website and app, with no registry or relay in them
        env:
          HOI_PUBLICATION: site
          VITE_HOI_REGISTRY_URL: ""
          VITE_HOI_RELAY_URLS: "[]"
        run: node scripts/reproduce.mjs --only static
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
