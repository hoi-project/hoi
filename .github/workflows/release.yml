# Opt-in signed draft releases. Version selects patch/minor/major checks; see docs/CI.md.
# Manual runs are explicit opt-in; automatic tag runs need the HOI_RELEASES_ENABLED switch in the
# hoi-project repository.
name: Release
run-name: Release · ${{ inputs.action || 'Build' }} · ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        type: choice
        required: true
        default: "Current version"
        options:
          - "Current version"
          - v1.0.0-preview.3
          - v1.0.0-preview.2
          - v1.0.0-preview.1
      action:
        description: "Action"
        type: choice
        default: Resume
        options:
          - Resume
          - Build
          - Check
          - Update tag
      desktop:
        description: "Desktop and setup"
        type: boolean
        default: true

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  # Current version and an explicit tag can select the same release.
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Validate tag, versions and test tier
    # Tag advances by the release app also send a push event. Only new tags start a release.
    if: github.event_name == 'workflow_dispatch' || (github.event.created && github.repository_owner == 'hoi-project' && vars.HOI_RELEASES_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Resolve retry configuration before starting the expensive checks.
    environment: release
    permissions:
      contents: read
      actions: read
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
      previous_tag_sha: ${{ steps.commit.outputs.previous_tag_sha }}
      prerelease: ${{ steps.tier.outputs.prerelease }}
      reuse_checks: ${{ steps.resume.outputs.reuse_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Select release source
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          ACTION: ${{ inputs.action || 'Build' }}
        run: |
          case "$ACTION" in Resume|Build|Check|'Update tag') ;; *) echo "Unknown release action." >&2; exit 1 ;; esac
          tag="$REQUESTED_TAG"
          if [ "$tag" = 'Current version' ]; then
            tag="$(node --input-type=module -e 'import { checkVersion } from "./scripts/release-version.mjs"; console.log(checkVersion().tag)')"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Choose a version tag." >&2; exit 1; }
          if [ "$ACTION" != 'Update tag' ]; then
            git checkout --detach "refs/tags/$tag"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Release: $tag · $ACTION" >> "$GITHUB_STEP_SUMMARY"
      - name: Require publication configuration
        run: HOI_PUBLICATION=1 node scripts/publication.mjs
      - name: Validate versions, channel and release checks
        id: tier
        run: node scripts/release-version.mjs --check "$TAG" --github-output
      - name: Pin all following jobs to this commit
        id: commit
        env:
          RETRY_UNPUBLISHED: ${{ inputs.action == 'Update tag' }}
        run: |
          sha="$(git rev-parse HEAD)"
          if [ "$RETRY_UNPUBLISHED" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch && test "$GITHUB_REF" = refs/heads/main ||
              { echo "Choose Update tag by running Release on main." >&2; exit 1; }
            ref="refs/tags/$TAG"
            previous="$(git rev-parse --verify "$ref")"
            if [ "$previous" != "$sha" ]; then
              test "$(git cat-file -t "$previous")" = commit ||
                { echo "Only lightweight release tags can be advanced." >&2; exit 1; }
              git merge-base --is-ancestor "$previous" "$sha" ||
                { echo "The selected main commit must descend from $TAG." >&2; exit 1; }
              echo "previous_tag_sha=$previous" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $TAG from $sha." >> "$GITHUB_STEP_SUMMARY"
      - name: Require tag retry configuration before checks
        if: steps.commit.outputs.previous_tag_sha != ''
        env:
          RELEASE_TAG_APP_CLIENT_ID: ${{ vars.HOI_RELEASE_TAG_APP_CLIENT_ID }}
          HAS_RELEASE_TAG_APP_PRIVATE_KEY: ${{ secrets.HOI_RELEASE_TAG_APP_PRIVATE_KEY != '' }}
        run: |
          missing=()
          [ -n "$RELEASE_TAG_APP_CLIENT_ID" ] || missing+=("variable HOI_RELEASE_TAG_APP_CLIENT_ID")
          [ "$HAS_RELEASE_TAG_APP_PRIVATE_KEY" = true ] || missing+=("secret HOI_RELEASE_TAG_APP_PRIVATE_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Set %s in the release environment before retrying an unpublished tag. See docs/RELEASES.md.\n' "${missing[@]}"
            exit 1
          fi
      - name: Check out recovery tooling from the selected workflow revision
        if: inputs.action == 'Resume'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: scripts/release-resume.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Find passed checks
        if: inputs.action == 'Resume'
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
          DESKTOP: ${{ inputs.desktop }}
        run: node release-tools/scripts/release-resume.mjs

  checks:
    needs: plan
    if: needs.plan.outputs.reuse_checks != 'true'
    uses: ./.github/workflows/release-checks.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.tag }}

  long:
    needs: plan
    if: needs.plan.outputs.tier == 'major' && needs.plan.outputs.reuse_checks != 'true'
    uses: ./.github/workflows/release-major.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.tag }}

  signing:
    name: signing secrets, tag and versions
    needs: [plan, checks, long, security, npm-audit]
    if: >-
      always() && !cancelled() &&
      needs.plan.result == 'success' &&
      ((needs.plan.outputs.reuse_checks == 'true' && needs.checks.result == 'skipped' && needs.long.result == 'skipped' && needs.security.result == 'skipped' && needs.npm-audit.result == 'skipped') ||
      (needs.plan.outputs.reuse_checks != 'true' && needs.checks.result == 'success' &&
      ((needs.plan.outputs.tier == 'major' && needs.long.result == 'success' && needs.security.result == 'success' && needs.npm-audit.result == 'success') ||
       (needs.plan.outputs.tier != 'major' && needs.long.result == 'skipped' && needs.security.result == 'skipped' && needs.npm-audit.result == 'skipped'))))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Signing secrets live in the release environment (v* tags and main only).
    environment: release
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      ALLOW_UNSIGNED: ${{ vars.HOI_ALLOW_UNSIGNED_INSTALLERS }}
      DESKTOP: ${{ github.event_name != 'workflow_dispatch' || inputs.desktop }}
    steps:
      - name: The tag names a version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Not a release tag: $TAG (expected vX.Y.Z)" >&2; exit 2; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The tree carries the tag's version
        run: node scripts/release-version.mjs --check "${TAG#v}"
      - name: Refuse to build a release that would ship unsigned
        run: |
          missing() { for n in "$@"; do [ -n "${!n}" ] || echo "$n"; done; }
          manifest="$(missing MINISIGN_SECRET_KEY MINISIGN_PASSWORD)"
          if [ -n "$manifest" ]; then
            echo "The signed manifest needs: $manifest" >&2
            exit 1
          fi
          [ "$DESKTOP" = "true" ] || exit 0
          updater="$(missing TAURI_SIGNING_PRIVATE_KEY)"
          if [ -n "$updater" ]; then
            echo "Signed desktop updates need: $updater" >&2
            exit 1
          fi
          installers="$(missing APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD)"
          if [ -n "$installers" ]; then
            if [ "$ALLOW_UNSIGNED" != "true" ]; then
              echo "Installer signing needs: ${installers//$'\n'/ }. Set HOI_ALLOW_UNSIGNED_INSTALLERS=true to release unsigned installers on purpose." >&2
              exit 1
            fi
            echo "::warning::Releasing unsigned installers (HOI_ALLOW_UNSIGNED_INSTALLERS=true). The release notes say so."
          fi
      # Before hours of builds: each secret key signs a test file that its public key in
      # publication.json verifies. A Tauri updater key is a minisign key, base64-wrapped.
      - name: The signing keys match publication.json
        run: |
          sudo apt-get install -y minisign
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          echo hoi > "$work/test"
          check() {
            printf '%s' "$1" | base64 -d > "$work/key"
            echo "$2" | minisign -S -s "$work/key" -m "$work/test" -x "$work/test.sig" > /dev/null
            rm -f "$work/key"
            minisign -Vq -m "$work/test" -x "$work/test.sig" -P "$3" || { echo "$4 does not match $5 in publication.json" >&2; exit 1; }
          }
          check "$MINISIGN_SECRET_KEY" "$MINISIGN_PASSWORD" "$(node -p "require('./publication.json').manifestKey")" MINISIGN_SECRET_KEY manifestKey
          [ "$DESKTOP" = "true" ] || exit 0
          check "$TAURI_SIGNING_PRIVATE_KEY" "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$(node -p "require('./publication.json').updaterKey")" TAURI_SIGNING_PRIVATE_KEY updaterKey

  security:
    needs: plan
    if: needs.plan.outputs.tier == 'major' && needs.plan.outputs.reuse_checks != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        manifest: [core/Cargo.toml, apps/desktop/src-tauri/Cargo.toml, apps/setup/src-tauri/Cargo.toml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-dependency-security.mjs
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}
          arguments: --all-features
      # A second reading of the RustSec database: it fails on vulnerabilities; deny.toml above
      # decides what unmaintained or yanked crates mean for each graph.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit@0.22.2
      - name: RustSec audit of the lockfile
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: cargo audit --file "$(dirname "$MANIFEST")/Cargo.lock"

  npm-audit:
    needs: plan
    if: needs.plan.outputs.tier == 'major' && needs.plan.outputs.reuse_checks != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm audit --audit-level low

  # One draft release for every job below to upload into, made before any of them starts, so
  # the desktop and node builds run side by side. An existing draft must be empty or carry
  # the same source marker before its assets can be reused.
  draft:
    needs: [plan, signing]
    if: always() && !cancelled() && inputs.action != 'Check' && needs.plan.result == 'success' && needs.signing.result == 'success'
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      SIGNED: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE != '' }}
      DESKTOP: ${{ github.event_name != 'workflow_dispatch' || inputs.desktop }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.plan.outputs.previous_tag_sha != ''
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: needs.plan.outputs.previous_tag_sha != ''
        id: retry-token
        with:
          client-id: ${{ vars.HOI_RELEASE_TAG_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOI_RELEASE_TAG_APP_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: write
      - name: Advance the unpublished tag
        if: needs.plan.outputs.previous_tag_sha != ''
        env:
          GH_TOKEN: ${{ steps.retry-token.outputs.token }}
          PREVIOUS_SHA: ${{ needs.plan.outputs.previous_tag_sha }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          # Immutable releases also protect against publication racing this update.
          test "$(gh api "repos/$GH_REPO/immutable-releases" --jq .enabled)" = true ||
            { echo "Enable immutable releases before advancing release tags." >&2; exit 1; }
          releases="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\" or (.draft and (.tag_name | startswith(\"untagged-\")) and .name == \"hoi $TAG\")) | .draft")"
          case "$releases" in
            '') ;;
            true) echo "Discard the existing draft for $TAG before retrying with a different commit." >&2; exit 1 ;;
            *) echo "Release $TAG is already published. Use a new version." >&2; exit 1 ;;
          esac
          # A second actor changing this ref after validation invalidates the lease.
          ref="refs/tags/$TAG"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push \
            --force-with-lease="$ref:$PREVIOUS_SHA" origin "$SOURCE_SHA:$ref"
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$SOURCE_SHA" ||
            { echo "Tag $TAG does not point to the validated commit." >&2; exit 1; }
      - id: draft
        name: Prepare release draft
        env:
          PREVIOUS_SHA: ${{ needs.plan.outputs.previous_tag_sha }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          if [ "$DESKTOP" != "true" ]; then
            notes="hoi-node only. Verify downloads against the signed manifest.json (minisign)."
          elif [ "$SIGNED" = "true" ]; then
            notes="Verify downloads against the signed manifest.json (minisign)."
          else
            notes="These installers are NOT code-signed for Windows and macOS. Verify downloads against the signed manifest.json (minisign) before running them."
          fi
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$SOURCE_SHA" ||
            { echo "Tag $TAG does not point to the validated commit." >&2; exit 1; }
          # Pending drafts may expose an untagged-* placeholder instead of the selected tag.
          # List first: lookup errors must not be mistaken for an absent release.
          release_url="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\" or (.draft and (.tag_name | startswith(\"untagged-\")) and .name == \"hoi $TAG\")) | .url")"
          [[ "$release_url" != *$'\n'* ]] || { echo "Multiple releases match $TAG. Inspect them before retrying." >&2; exit 1; }
          if [ -n "$release_url" ]; then
            test -z "$PREVIOUS_SHA" || { echo "A release for $TAG appeared during the tag update. Inspect it before retrying." >&2; exit 1; }
            metadata="$(gh api "$release_url" --jq '[.id, .draft, .prerelease, (.assets | length), ((.body // "") | @base64)] | @tsv')"
            read -r id draft prerelease assets body64 <<< "$metadata"
            test "$draft" = true || { echo "Release $TAG is already published; use a new version." >&2; exit 1; }
            body="$(printf '%s' "$body64" | base64 --decode)"
            source="$(printf '%s\n' "$body" | sed -n 's/^<!-- hoi-release-source: \([0-9a-f]\{40,64\}\) -->$/\1/p')"
            test -z "$source" || test "$source" = "$SOURCE_SHA" ||
              { echo "Draft $TAG belongs to another source commit. Inspect it before retrying." >&2; exit 1; }
            # Existing assets need recorded provenance; an empty interrupted draft can be bound now.
            test "$source" = "$SOURCE_SHA" || test "$assets" = 0 ||
              { echo "Draft $TAG has assets without a matching source commit. Inspect it before retrying." >&2; exit 1; }
            if [ "$source" != "$SOURCE_SHA" ] || [ "$prerelease" != "$PRERELEASE" ]; then
              [ "$source" = "$SOURCE_SHA" ] || body="${body}"$'\n\n'"<!-- hoi-release-source: $SOURCE_SHA -->"
              # target_commitish is only for creating a missing tag, not source provenance.
              # Setting it to an older workflow revision needs a permission GITHUB_TOKEN cannot get.
              id="$(gh api --method PATCH "$release_url" -f "body=$body" -F "prerelease=$PRERELEASE" --jq .id)"
            fi
          else
            # Drafts have pending tags; do not refind a newly created release in the REST list.
            notes="${notes}"$'\n\n'"<!-- hoi-release-source: $SOURCE_SHA -->"
            id="$(gh api --method POST "repos/$GH_REPO/releases" -f "tag_name=$TAG" \
              -f "name=hoi $TAG" -f "body=$notes" \
              -F draft=true -F "prerelease=$PRERELEASE" --jq .id)"
          fi
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "No release found for $TAG" >&2; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: [plan, draft]
    environment: release
    permissions:
      contents: write
    if: always() && !cancelled() && needs.draft.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.desktop)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ""
            rust_targets: ""
          # A Raspberry Pi 5 with a desktop, and other 64-bit ARM Linux computers.
          - os: ubuntu-22.04-arm
            args: ""
            rust_targets: ""
          - os: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf rpm
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.rust_targets }}
      - run: pnpm install --frozen-lockfile
      - name: Windows code-signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'hoi-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = Join-Path $env:RUNNER_TEMP 'tauri-signing.json'
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5 | Set-Content -Path $config -Encoding utf8
          "TAURI_SIGNING_ARGS=--config $config" >> $env:GITHUB_ENV
      - name: Prepare signed updater artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node scripts/prepare-desktop-release.mjs "$RUNNER_TEMP/hoi-updater.json"
          echo "TAURI_SIGNING_ARGS=--config $RUNNER_TEMP/hoi-updater.json" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOI_PUBLICATION: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # tauri-action signs and notarizes macOS bundles when these are set.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }} ${{ env.TAURI_SIGNING_ARGS }}

  # The node setup app (apps/setup): the same platforms as the desktop app, the same switch.
  setup:
    needs: [plan, draft]
    environment: release
    permissions:
      contents: write
    if: always() && !cancelled() && needs.draft.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.desktop)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ""
            rust_targets: ""
          # A Raspberry Pi 5 with a desktop, and other 64-bit ARM Linux computers.
          - os: ubuntu-22.04-arm
            args: ""
            rust_targets: ""
          - os: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.rust_targets }}
      - run: pnpm install --frozen-lockfile
      - name: Windows code-signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'hoi-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = Join-Path $env:RUNNER_TEMP 'tauri-signing.json'
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5 | Set-Content -Path $config -Encoding utf8
          "TAURI_SIGNING_ARGS=--config $config" >> $env:GITHUB_ENV
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # tauri-action signs and notarizes macOS bundles when these are set.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/setup
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }} ${{ env.TAURI_SIGNING_ARGS }}

  node:
    needs: [plan, draft]
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_ID: ${{ needs.draft.outputs.id }}
      SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    if: always() && !cancelled() && needs.draft.result == 'success'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
          # A Mac mini or any Mac as an always-on home node: both architectures on one runner.
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Check out draft asset tooling from the selected workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: scripts/release-assets.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.targets }}
      - name: Build and upload hoi-node
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ matrix.targets }}
        run: |
          v="${TAG#v}"
          for target in ${TARGETS//,/ }; do
            # Built as anyone can build it again: remapped paths, the commit's time, the pinned
            # toolchain (scripts/reproduce.mjs). Its digest is published beside it.
            node scripts/reproduce.mjs --only node --target "$target" > "hoi-node_${v}_${target}.digests.json"
            exe=hoi-node
            case "$target" in *windows*) exe=hoi-node.exe ;; esac
            tar -C "core/target/$target/release" -czf "hoi-node_${v}_${target}.tar.gz" "$exe"
            node release-tools/scripts/release-assets.mjs upload "hoi-node_${v}_${target}.tar.gz" "hoi-node_${v}_${target}.digests.json"
          done

  manifest:
    needs: [plan, draft, desktop, setup, node]
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_ID: ${{ needs.draft.outputs.id }}
      SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Also when the desktop and setup builds were left out on purpose; never after a failed build.
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.node.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') && (needs.setup.result == 'success' || needs.setup.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check out draft asset tooling from the selected workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: scripts/release-assets.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download release assets
        run: node release-tools/scripts/release-assets.mjs download out
        env:
          GH_TOKEN: ${{ github.token }}
      # The installers of this tag join the files, so a folder of the release's files installs as it
      # is (install.sh uses the release files beside it, offline too). The manifest lists only what
      # they install; the attestation below covers them too.
      - name: Installers
        run: node scripts/publication.mjs --installers out
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - name: Build manifest (sizes and SHA-256 of every file)
        # The repository variable HOI_RELEASE_BASE_URL, when set, names where the files are
        # published for people without access to this repository (docs/RELEASES.md).
        env:
          HOI_RELEASE_BASE_URL: ${{ vars.HOI_RELEASE_BASE_URL }}
        run: node scripts/release-manifest.mjs out "$TAG" > manifest.json
      - name: Sign manifest with minisign
        run: |
          sudo apt-get install -y minisign
          echo "$MINISIGN_SECRET_KEY" | base64 -d > minisign.key
          echo "$MINISIGN_PASSWORD" | minisign -S -s minisign.key -m manifest.json -t "hoi ${TAG}"
          rm minisign.key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      - name: Verify candidate before upload
        run: |
          cp manifest.json manifest.json.minisig out/
          node scripts/release-check.mjs out
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "out/*"
      - run: node release-tools/scripts/release-assets.mjs upload manifest.json manifest.json.minisig out/install.sh out/install.ps1
        env:
          GH_TOKEN: ${{ github.token }}
