# Code scanning and supply chain. Pull requests run what their changes touch (scripts/ci-changes.mjs):
# CodeQL for the languages changed, workflow linting for workflow changes, dependency audits for
# manifest and lockfile changes. Main and a daily run check everything, so a new advisory shows up
# within a day without turning unrelated pull requests red. Not a required check. Where it runs:
# as CI (public hoi-project repository by itself; anywhere by hand). See docs/CI.md.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Changes
    if: github.event_name == 'workflow_dispatch' || (github.repository_owner == 'hoi-project' && github.event.repository.private != true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deps: ${{ steps.match.outputs.deps }}
      workflows: ${{ steps.match.outputs.workflows }}
      codeql: ${{ steps.match.outputs.codeql }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: match
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/ci-changes.mjs

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.codeql != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # analyze reads this workflow run; without it a private repository answers 403.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.codeql) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - vendor
              - "**/node_modules"
              - apps/web/src/lib/core/wasm/pkg
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          # A private repository without GitHub Code Security cannot receive results: analyse, keep them.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

  rust-deps:
    name: Rust dependencies (${{ matrix.manifest }})
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # core/fuzz has its own lockfile: the fuzzers' dependencies are audited like the shipped ones.
        manifest: [core/Cargo.toml, core/fuzz/Cargo.toml, apps/desktop/src-tauri/Cargo.toml, apps/setup/src-tauri/Cargo.toml]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test scripts/check-dependency-security.test.mjs
      # Prebuilt binaries: seconds, where cargo install compiled cargo-audit for five minutes.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: cargo-deny (licences, advisories, bans, sources)
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: cargo deny --manifest-path "$MANIFEST" --all-features check
      # A second reading of the RustSec database: it fails on vulnerabilities; deny.toml above
      # decides what unmaintained or yanked crates mean for each graph.
      - name: RustSec audit of the lockfile
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: cargo audit --file "$(dirname "$MANIFEST")/Cargo.lock"

  # Every crate in core/Cargo.lock is either audited (imported audits from other projects or our
  # own in core/supply-chain/audits.toml) or listed as an exemption at its current version, so a
  # new crate or a version bump fails here until someone reviews it.
  vet:
    name: cargo vet
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-vet@0.10.3
      - run: cargo vet --locked
        working-directory: core

  npm:
    name: npm advisories
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm audit --audit-level low

  # New or changed dependencies in a pull request, against GitHub's advisory database.
  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: never

  workflows:
    name: Workflow security
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Template injection, excessive permissions, unpinned actions, credential persistence.
      # A gate, not an upload: it fails the job on a medium or higher finding, and needs no write
      # permission, so pull requests from forks get it too. Exceptions: .github/zizmor.yml.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          advanced-security: "false"
          min-severity: medium
          annotations: "true"
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
