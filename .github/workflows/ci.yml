# Every pull request and push to main. One cheap `changes` job decides what the run needs
# (scripts/ci-changes.mjs); the rest run only for what changed, and a skipped job counts as passed
# for required checks. Rust builds once: the tests run under coverage, and SonarCloud uses that
# report instead of running them again. See docs/CI.md.
#
# Where it runs: by itself only in the public hoi-project repository, where Actions are free.
# Anywhere else (the private workspace, hoi-project/hoi before it is public, a fork) only when
# started by hand with Run workflow, which checks everything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  # Line tables are enough for backtraces; full debug info makes builds and caches slower.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    name: Changes
    if: github.event_name == 'workflow_dispatch' || (github.repository_owner == 'hoi-project' && github.event.repository.private != true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.match.outputs.rust }}
      web: ${{ steps.match.outputs.web }}
    steps:
      # Commits only, no file contents: enough to diff the pull request or the push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: match
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/ci-changes.mjs

  quick:
    name: Quick checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The release tests verify signatures with @noble/curves and @noble/hashes.
      - run: pnpm install --frozen-lockfile
      - name: Metadata, tokens, boundaries, wiki, SBOM and focused regression tests
        run: pnpm check:quick

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Full Svelte checks need the generated WASM bindings and run in the major suites.
      - name: Site and API types
        run: pnpm --filter @hoi/site check && pnpm --filter @hoi/core-api check
      - name: Web app unit tests
        run: pnpm --filter @hoi/web test -- --maxWorkers 2

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # A cold cache (a new lockfile, a toolchain bump) compiles the instrumented test build from
    # scratch: about 20 minutes on a 2-core private runner, less on the 4-core public ones.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy, llvm-tools-preview
      # Prebuilt binaries: seconds, where cargo install compiles for minutes.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.151,cargo-llvm-cov@0.9.1
      # Only main writes the cache (pushes and manual runs there); pull requests read it and never
      # write, so a pull request cannot plant anything a later run on main would restore.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          shared-key: ci
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Every test once, under coverage for SonarCloud (includes the conformance vectors: hoi-validate
      # fails if core/vectors/ is stale). nextest runs each test in its own process. It does not run
      # doctests; the workspace has none, and the weekly suites run cargo test, which would.
      - name: Tests with coverage
        run: cargo llvm-cov nextest --locked --workspace --no-fail-fast --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: core/lcov.info
          retention-days: 3
          if-no-files-found: error

  # SonarCloud: bugs, smells, duplication and security hotspots, with the Rust job's coverage.
  # Pull requests from forks get no SONAR_TOKEN, and SonarCloud is free only for public projects,
  # so without a token the job passes with a notice. Not a required check.
  sonarcloud:
    name: SonarCloud
    needs: [changes, rust]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.rust.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for the SonarCloud token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not available (a fork pull request, a private repository, or not configured yet); skipping the SonarCloud scan."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.available == 'true'
        with:
          # Sonar tells new code from old by the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.available == 'true' && needs.rust.result == 'success'
        with:
          name: rust-coverage
          path: core
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        if: steps.token.outputs.available == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
