# Full suites: called by Release for major versions, and by Weekly on main. See docs/CI.md.
name: "Release: major suites"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      weekly:
        description: "A scheduled run on main, not a release: skip the major-version check"
        type: boolean
        default: false
      linux_only:
        description: "Linux legs only (a cheap test run in a private repository, where macOS and Windows minutes cost many times more)"
        type: boolean
        default: false

permissions:
  contents: read

# Line tables are enough for backtraces; full debug info filled the Linux runner's disk in the
# workspace test build. Release builds (the reproducible job) are not affected.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  verify-major:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Refuse long suites for a non-major version
        if: ${{ !inputs.weekly }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(node scripts/release-tier.mjs "$VERSION")" = major
          node scripts/release-local.mjs --check-version "${VERSION#v}"

  rust:
    name: rust (${{ matrix.os }})
    needs: verify-major
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.linux_only && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The hosted Linux image ships SDKs this job never uses; the workspace test build needs the room.
      - name: Free disk space
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  acceptance:
    name: acceptance runs and the 200-node battle
    needs: verify-major
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - name: M0, two nodes through the embedded relay (5 s, expiry)
        run: cargo test --locked -p hoi-node m0_acceptance -- --ignored --nocapture
      - name: M1, a flood of 1,000 records from 50 fresh keys at five nodes, banned everywhere
        run: cargo test --locked --release -p hoi-core m1_acceptance -- --ignored --nocapture
      - name: 200 real nodes under siege, a fifth offline at any time
        run: cargo test --locked --release -p hoi-sim two_hundred -- --ignored --nocapture

  fuzz:
    name: fuzz (every decoder target, a minute each)
    needs: verify-major
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: core/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Run every target
        run: |
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=2048
          done

  android:
    name: android (build only)
    needs: verify-major
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - run: cargo install cargo-ndk --locked
      - name: Build with the runner's installed Android NDK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-}}}"
          test -f "$ANDROID_NDK_HOME/source.properties" || { echo "No installed Android NDK at $ANDROID_NDK_HOME" >&2; exit 1; }
          cargo ndk -t arm64-v8a build -p hoi-ffi --release --locked

  ios:
    name: ios (build only)
    needs: verify-major
    if: ${{ !inputs.linux_only }}
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - run: cargo build --locked -p hoi-ffi --release --target aarch64-apple-ios
      - run: cargo build --locked -p hoi-ffi --release --target aarch64-apple-ios-sim

  reproducible:
    name: reproducible builds
    needs: verify-major
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - name: wasm-bindgen-cli (same version as the crate, prebuilt)
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install --frozen-lockfile
      # Two builds from empty target directories: the wasm package, hoi-node and the static
      # site must come out byte for byte the same (scripts/reproduce.mjs).
      - run: node scripts/reproduce.mjs --twice

  browser-e2e:
    name: browser end-to-end
    needs: verify-major
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - name: wasm-bindgen-cli (same version as the crate, prebuilt)
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install --frozen-lockfile
      - run: pnpm core:wasm
      - name: Full JavaScript and sandbox tests
        run: pnpm check && pnpm test && pnpm test:sandbox
      - run: pnpm build:site && pnpm build:web && node scripts/assemble-static.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Encrypted vault setup, unlocking, migration and tamper protection
        run: node scripts/e2e-vault.mjs
      - name: Passkey unlock with a virtual authenticator (PRF)
        run: node scripts/e2e-passkey.mjs
      - name: OS-unlock controls and password fallback (stubbed native boundary)
        run: node scripts/e2e-os-unlock.mjs
      - name: Accessibility audit (axe-core on every route, both themes, desktop and phone)
        run: node scripts/e2e-a11y.mjs
      - name: Wiki pages and rules changes as Loro documents in the wasm core
        run: node scripts/e2e-wiki.mjs
      - name: site end-to-end (no third-party requests, no overflow, demos run)
        run: node apps/site/scripts/e2e.mjs --quick
      - name: Worker bundles validate without deployment
        run: |
          pnpm dlx wrangler@4 deploy --config registry/wrangler.toml --dry-run --outdir test-results/registry
          pnpm dlx wrangler@4 deploy --config relay/wrangler.toml --dry-run --outdir test-results/relay
      - name: Client discovery and signed browser registration
        run: |
          node scripts/e2e-discovery.mjs
          node scripts/e2e-registry-browser.mjs
      - name: Static app and separately deployed encrypted relay
        run: |
          node scripts/e2e-deployment.mjs
          mkdir -p test-results
          pnpm dlx wrangler@4 dev --config relay/wrangler.toml --local --ip 127.0.0.1 --port 8788 >test-results/relay.log 2>&1 &
          RELAY_PID=$!
          trap 'kill "$RELAY_PID"' EXIT
          HOI_PRIVATE_RELAY_TEST_URL=http://127.0.0.1:8788 node scripts/e2e-private-relay.mjs
      - name: Build home node for browser integration
        run: cargo build --locked --manifest-path core/Cargo.toml -p hoi-node
      - name: WASM registry proofs
        run: node scripts/e2e-registry.mjs
      - name: Public peer has no paired-device control listener
        run: node scripts/e2e-peer-only.mjs
      - name: Registry as a node passes the shared API conformance suite and writes a compatible database
        run: node scripts/e2e-registry-node.mjs
      - name: Browser sync through a home node
        run: node scripts/e2e-network.mjs
      - name: Phone pairing, one-scan linking and joining over WebRTC
        run: node scripts/e2e-rtc.mjs
      - name: Public key join through a carrying node with the author offline
        run: node scripts/e2e-public-network.mjs
      - name: A node link finds and carries communities with nothing configured
        run: node scripts/e2e-node-link.mjs
      - name: Private communities through hoi-node mailboxes, with no relay
        run: node scripts/e2e-mailboxes.mjs
      - name: Two browsers link directly, introduced by a node, and keep syncing without it
        run: node scripts/e2e-direct.mjs

  webrtc-browsers:
    name: WebRTC end-to-end (${{ matrix.browser }})
    needs: verify-major
    strategy:
      fail-fast: false
      matrix:
        # Firefox on Linux, and Safari's engine: on macOS Playwright's WebKit is closest to Safari.
        include: ${{ fromJSON(inputs.linux_only && '[{"browser":"firefox","os":"ubuntu-latest"}]' || '[{"browser":"firefox","os":"ubuntu-latest"},{"browser":"webkit","os":"macos-latest"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HOI_E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - name: wasm-bindgen-cli (same version as the crate, prebuilt)
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install --frozen-lockfile
      - run: pnpm core:wasm
      - run: pnpm build:web
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Build home node
        run: cargo build --locked --manifest-path core/Cargo.toml -p hoi-node
      - name: Browser sync through a home node
        run: node scripts/e2e-network.mjs
      - name: Phone pairing, one-scan linking and joining over WebRTC
        run: node scripts/e2e-rtc.mjs
      - name: A node link finds and carries communities with nothing configured
        run: node scripts/e2e-node-link.mjs
      - name: Two browsers link directly, introduced by a node, and keep syncing without it
        run: node scripts/e2e-direct.mjs

  desktop:
    name: desktop (${{ matrix.os }})
    needs: verify-major
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.linux_only && '["ubuntu-22.04"]' || '["ubuntu-22.04","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hoi/web build:desktop
      - run: cargo build --locked
        working-directory: apps/desktop/src-tauri
      - run: cargo test --locked --lib
        working-directory: apps/desktop/src-tauri

  installers:
    name: install.ps1 (windows)
    needs: verify-major
    if: ${{ !inputs.linux_only }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\deploy\install\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # Windows PowerShell 5.1, the one every Windows has.
      - name: install.ps1 picks, fetches and checks the app from a release folder, and refuses a changed one
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Content -Path (Join-Path $dir 'hoi_0.0.1_x64-setup.exe') -Value 'not a real setup'
          cmd /c "node scripts\release-manifest.mjs `"$dir`" v0.0.1 > `"$dir\manifest.json`""
          .\deploy\install\install.ps1 -Role desktop -From $dir -DryRun -Yes -AllowUnsignedLocal
          Add-Content -Path (Join-Path $dir 'hoi_0.0.1_x64-setup.exe') -Value 'changed'
          $refused = $false
          try { .\deploy\install\install.ps1 -Role desktop -From $dir -DryRun -Yes -AllowUnsignedLocal } catch { $refused = $_.Exception.Message -match 'SHA-256' }
          if (-not $refused) { throw 'a file that differs from the release list was not refused' }
