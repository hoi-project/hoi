name: Bug report
description: Report a reproducible problem. Use private vulnerability reporting for security issues.
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and steps to reproduce. Do not include private keys or personal data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: Release or commit, operating system and browser (if relevant).
    validations:
      required: true
